# Only what exists today. Each phase adds its own service here — that is part of
# the task, not something handed to you. See TASKS.md.
#
# Spark is NOT containerised: you run PySpark from the uv venv on the host. That
# is the normal local dev loop and it saves ~2GB of RAM you do not have.
#
# Always pass a profile:  make up PROFILE=ingest
name: streamhouse

services:
  kafka:
    image: apache/kafka:3.9.0
    container_name: streamhouse-kafka
    profiles: [ingest, pipeline, serve, orchestrate]
    ports:
      - "9092:9092"
    environment:
      # KRaft: this node is both broker and controller. No Zookeeper.
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,INTERNAL://:19092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,INTERNAL://kafka:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      # Single node, so nothing can be replicated. Do not copy these to prod.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_HEAP_OPTS: "-Xmx512m -Xms512m"
    volumes:
      - kafka-data:/var/lib/kafka/data
    deploy:
      resources:
        limits:
          memory: 1g
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12

# ---------------------------------------------------------------------------
# Added by you, in the phase that needs it:
#   P2  ingest-gateway   (java)      profiles: [ingest, pipeline, serve]
#   P6  serving-api      (java)      profiles: [serve]
#   P8  airflow, postgres            profiles: [orchestrate]
# ---------------------------------------------------------------------------

volumes:
  kafka-data:
