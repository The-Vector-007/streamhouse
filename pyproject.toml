[project]
name = "streamhouse"
version = "0.1.0"
description = "Real-time transaction lakehouse: Kafka to Spark Structured Streaming to Delta Lake"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pyspark==3.5.3",
    "delta-spark==3.2.1",
    "confluent-kafka>=2.6.0",
    "pydantic>=2.9",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-timeout>=2.3",
    "ruff>=0.7",
    "duckdb>=1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/streamhouse"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
# A hung Spark job should fail the run, not wedge it.
timeout = 300
markers = [
    "spark: needs a local SparkSession (slow, needs JAVA_HOME)",
    "kafka: needs the kafka container up (make up)",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
